# 宠物影像识别与荐购系统 · 前端 Nginx 配置：静态托管 React SPA，并把 /api/ 反向代理到后端容器
server {
    listen       80;
    server_name  _;

    # Vite 构建产物目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 允许上传略大于后端上限（后端限制 2 MB），留出 multipart 边界开销
    client_max_body_size 5m;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
    gzip_min_length 1024;

    # 后端 API 反向代理（compose 网络内通过服务名 backend 访问）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api/chat/stream）必需：关闭缓冲、长连接超时、清空 Connection 头
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源长缓存（Vite 产物带 hash 文件名）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：前端 React Router 接管所有非文件路径
    location / {
        try_files $uri $uri/ /index.html;
    }
}
