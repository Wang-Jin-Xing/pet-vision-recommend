# PetPals 一键部署：docker compose up --build
#
# 构建参数默认使用官方源；本机在仓库根目录 .env 中覆盖为国内镜像站，
# 海外/CI 环境不提供 .env 时仍可直接构建。
services:
  # ===== 后端：FastAPI + Uvicorn（内含 SQLite + ChromaDB 持久化数据） =====
  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-}
    image: petpals-backend:latest
    container_name: petpals-backend
    environment:
      # 生产部署请在同级 .env 文件中设置 SECRET_KEY 为独立随机值
      SECRET_KEY: ${SECRET_KEY:-petpals-dev-secret-please-change-in-production}
      # SQLite 与 Chroma 统一放到持久化卷目录（sqlite 绝对路径需 4 个斜杠）
      DATABASE_URL: sqlite:////app/data/petpals.db
      CHROMA_DIR: /app/data/chroma
      UPLOAD_DIR: /app/uploads
      # 直连后端端口或经 nginx(8080) 访问时允许的来源（经 nginx 同源访问不触发 CORS）
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000
      # 大模型（兼容 OpenAI 协议的网关，如智谱 GLM）；未配置则自动降级为本地确定性逻辑
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
      # 知识种子目录（镜像内置文档），启动时自动索引到 ChromaDB
      KNOWLEDGE_SEED_DIR: /app/seed_docs
    ports:
      - "8000:8000"
    volumes:
      # SQLite 数据库 + Chroma 向量库持久化
      - petpals-data:/app/data
      # 用户上传的原始文档持久化
      - petpals-uploads:/app/uploads
      # ChromaDB 嵌入模型缓存（首次启动下载一次，重建容器不丢失）
      - petpals-cache:/app/.cache
    restart: unless-stopped

  # ===== 前端：Nginx 托管 SPA 静态文件，/api 反代到后端 =====
  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE: ${NODE_BASE:-node:20-alpine}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: petpals-frontend:latest
    container_name: petpals-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  petpals-data:
    name: petpals-data
  petpals-uploads:
    name: petpals-uploads
  petpals-cache:
    name: petpals-cache
